<svg xmlns="http://www.w3.org/2000/svg" viewBox="-11 -4 124 110" width="100%" height="100%">
  <defs>
    <style>
      @keyframes cosine-rock {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-8deg); }
        75% { transform: rotate(8deg); }
      }
      @keyframes thruster-flame {
        0%, 100% { transform: scaleX(0.5); opacity: 0.7; }
        50% { transform: scaleX(1.15); opacity: 1.0; }
      }
      .rocket-ship {
        transform-origin: 55px 63px;
        animation: cosine-rock 3s ease-in-out infinite;
      }
      .exhaust-bar {
        transform-origin: 15.5px center;
        animation: thruster-flame 0.4s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
      }
      .flame-1 { animation-delay: 0.00s; }
      .flame-2 { animation-delay: -0.08s; }
      .flame-3 { animation-delay: -0.16s; }
      .flame-4 { animation-delay: -0.24s; }
      .flame-5 { animation-delay: -0.32s; }
    </style>
    <linearGradient id="flame-outer" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#C97320" />
      <stop offset="60%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#E63946" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="flame-core" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="40%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#C97320" stop-opacity="0" />
    </linearGradient>

    <!-- Starlight White Fuselage Cylindrical Lighting Gradient -->
    <linearGradient id="fuselage-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B4B4B4" />
      <stop offset="22%" stop-color="#DADADA" />
      <stop offset="52%" stop-color="#F5F5F5" />
      <stop offset="72%" stop-color="#FFFFFF" />
      <stop offset="88%" stop-color="#D2D2D2" />
      <stop offset="97%" stop-color="#EEEEEE" />
      <stop offset="100%" stop-color="#BEBEBE" />
    </linearGradient>

    <!-- Rocket Scarlet Arcade Gradients -->
    <linearGradient id="scarlet-grad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FF2E3E" />
      <stop offset="45%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#B01624" />
    </linearGradient>

    <linearGradient id="nosecone-grad" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#FF2E3E" />
      <stop offset="50%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#A51421" />
    </linearGradient>

    <!-- Engine Collar Metallic Gradient -->
    <linearGradient id="collar-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7D7D7D" />
      <stop offset="50%" stop-color="#BEBEBE" />
      <stop offset="100%" stop-color="#787878" />
    </linearGradient>

    <!-- Porthole Bezel Gradient -->
    <linearGradient id="bezel-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBEBEB" />
      <stop offset="50%" stop-color="#BDBDBD" />
      <stop offset="100%" stop-color="#919191" />
    </linearGradient>

    <!-- Porthole Cyan Glass Gradient -->
    <linearGradient id="glass-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#73EBFF" />
      <stop offset="40%" stop-color="#4CC9F0" />
      <stop offset="100%" stop-color="#198CAF" />
    </linearGradient>

    <!-- Guinea Pig Fur Gradient -->
    <linearGradient id="fur-grad" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F2F2F2" />
      <stop offset="80%" stop-color="#DADADA" />
      <stop offset="100%" stop-color="#BEBEBE" />
    </linearGradient>

    <!-- Guinea Pig Dark Patch Gradient -->
    <linearGradient id="patch-grad" x1="0.3" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#737373" />
      <stop offset="50%" stop-color="#505050" />
      <stop offset="100%" stop-color="#303030" />
    </linearGradient>

    <!-- Paw Pink Gradient -->
    <linearGradient id="paw-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFCDCD" />
      <stop offset="50%" stop-color="#FFB4B4" />
      <stop offset="100%" stop-color="#F2A0A0" />
    </linearGradient>

    <!-- Guinea Pig Contact Shadow on Fuselage -->
    <radialGradient id="gp-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g class="rocket-ship">
    <!-- Thruster Exhaust Jet Plume (5 Staggered High-Velocity Bars) -->
    <g id="thruster-exhaust">
      <!-- Bar 1 (Upper Outer) -->
      <rect class="exhaust-bar flame-1" x="5" y="50" width="10.5" height="3" rx="1.5" fill="url(#flame-outer)" />
      <!-- Bar 2 (Upper Core) -->
      <rect class="exhaust-bar flame-2" x="0" y="55" width="15.5" height="4" rx="2" fill="url(#flame-core)" />
      <!-- Bar 3 (Center Jet Spine) -->
      <rect class="exhaust-bar flame-3" x="-4" y="61" width="19.5" height="5" rx="2.5" fill="url(#flame-core)" />
      <!-- Bar 4 (Lower Core) -->
      <rect class="exhaust-bar flame-4" x="1" y="68" width="14.5" height="4" rx="2" fill="url(#flame-core)" />
      <!-- Bar 5 (Lower Outer) -->
      <rect class="exhaust-bar flame-5" x="6" y="74" width="9.5" height="3" rx="1.5" fill="url(#flame-outer)" />
    </g>

    <!-- 1. Background Fins -->
    <!-- Top Fin (Swoops backward behind guinea pig haunch) -->
    <path id="top-fin"
          d="M 22,26 C 12,26.5 4,28 0.5,30.5 C 6,32.5 15,34.8 24,36 Z"
          fill="url(#scarlet-grad)" stroke="#030303" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Bottom Fin (Iconic retro swept wing attached along belly) -->
    <path id="bottom-fin"
          d="M 26,86 C 24.5,91 10,93 0.5,95.5 C 4,98.2 14,99.2 25,99 C 32,98.8 36,94 35.5,87.5 C 33,86.5 29,86 26,86 Z"
          fill="url(#scarlet-grad)" stroke="#030303" stroke-width="1.8" stroke-linejoin="round" />

    <!-- 2. Rocket Engine Collar -->
    <path id="engine-collar"
          d="M 15.5,47.5 L 23.5,43.5 L 23.5,83.5 L 15.5,80.5 Z"
          fill="url(#collar-grad)" stroke="#030303" stroke-width="1.8" stroke-linejoin="round" />

    <!-- 3. Rocket Fuselage (With 3D volume lighting) -->
    <path id="fuselage"
          d="M 23.5,43.5 C 38,39 62,39 77.5,42.5 L 77.5,83.5 C 61,89.8 38,89.8 23.5,83.5 Z"
          fill="url(#fuselage-grad)" stroke="#030303" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Contact Shadow under Guinea Pig -->
    <ellipse cx="50" cy="47" rx="26" ry="8.5" fill="url(#gp-shadow)" />

    <!-- 4. Surface-Mounted Horizontal Stabilizer Fin -->
    <g id="horizontal-stabilizer">
      <!-- Drop shadow beneath fin on fuselage -->
      <path d="M 16,65.2 L 37.5,65.2 C 38,65.2 38.5,65.8 38,66.4 L 16,66.4 Z" fill="#000000" opacity="0.45" />
      <!-- Lateral Fin Blade -->
      <path id="horizontal-fin"
            d="M 37.5,61.2 L 1.5,61.2 C 0.6,61.2 0,61.8 0,62.8 C 0,63.8 0.6,64.6 1.5,64.6 L 37.5,64.6 C 38.5,64.6 39,63.8 39,62.8 C 39,61.8 38.5,61.2 37.5,61.2 Z"
            fill="url(#scarlet-grad)" stroke="#030303" stroke-width="1.8" stroke-linejoin="round" />
      <!-- Specular Highlight Ridge -->
      <line x1="2" y1="62.1" x2="37" y2="62.1" stroke="#FFAAB0" stroke-width="0.8" stroke-linecap="round" />
    </g>

    <!-- 5. Rocket Nosecone -->
    <path id="nosecone"
          d="M 77.5,42.5 C 85,47 93,54.5 98.8,63.5 C 93,72 85,78.5 77.5,83.5 Z"
          fill="url(#nosecone-grad)" stroke="#030303" stroke-width="1.8" stroke-linejoin="round" />

    <!-- 6. Porthole Window -->
    <g id="porthole">
      <!-- Outer Dark Rim -->
      <ellipse cx="57" cy="63" rx="9.2" ry="9.8" fill="#030303" />
      <!-- Metallic Bezel -->
      <ellipse cx="57" cy="63" rx="7.8" ry="8.2" fill="url(#bezel-grad)" stroke="#555555" stroke-width="0.5" />
      <!-- Cyan Glass Disc -->
      <ellipse cx="57" cy="63" rx="5.8" ry="6.2" fill="url(#glass-grad)" stroke="#030303" stroke-width="0.9" />
      <!-- Glass Specular Reflection Highlight -->
      <path d="M 53.5,60 C 54.5,58.2 57.5,57.8 59.8,58.5 C 61,59 61.2,60 60.5,60.2 C 58.2,59.4 55.5,59.6 53.5,60 Z"
            fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- 7. Guinea Pig Mascot -->
    <g id="guinea-pig">
      <!-- Main Body Silhouette -->
      <path id="gp-body"
            d="M 23,38 C 21.5,29 22,18 24,12 C 26.5,6 31,0.5 38,0.5 C 47,0.5 56,2.5 64,6.5 C 68,6 72,2.8 77,2 C 81.5,2.5 82,6 81.5,10 C 85,13.8 89.5,18 93.8,23 C 94.8,24.5 94.2,26.5 92,28.5 C 88,32 83,35.5 78.5,39 C 74,42 70,44.5 67,46 C 58,45 44,44.5 33,44.5 C 27,44.5 24,42.5 23,38 Z"
            fill="url(#fur-grad)" stroke="#030303" stroke-width="1.8" stroke-linejoin="round" />

      <!-- Rear Haunch Crease Line -->
      <path d="M 25,31 C 27,37 30,41 34.5,43.5"
            fill="none" stroke="#999999" stroke-width="1.0" stroke-linecap="round" />

      <!-- Dark Fur Patch (Head / Eye / Cheek / Ear) -->
      <path id="gp-patch"
            d="M 65,6.5 C 68,5.8 72,2.8 77,2 C 81.5,2.5 82,6 81.5,10 C 83.8,13.5 85.5,17.5 85,22 C 84,27 80.5,30 75.5,31.5 C 71,32 67.5,26.5 66,20 C 64.8,15 64.8,9.5 65,6.5 Z"
            fill="url(#patch-grad)" />

      <!-- Ear Fold & Ridge -->
      <path d="M 73.5,6 C 75,3.8 78,3 80,4 C 80.5,6 79.5,9.5 77.5,11"
            fill="none" stroke="#262626" stroke-width="1.0" stroke-linecap="round" />

      <!-- Curious Black Bead Eye with Specular Catchlight -->
      <ellipse cx="80.5" cy="23.2" rx="2.1" ry="2.3" fill="#030303" />
      <circle cx="79.9" cy="22.4" r="0.75" fill="#FFFFFF" />

      <!-- Cute Pink Snout Nose -->
      <ellipse cx="93.6" cy="24.8" rx="1.6" ry="2.2" fill="url(#paw-grad)" stroke="#030303" stroke-width="0.8" />

      <!-- Whiskers -->
      <g stroke="#4A4A4A" stroke-width="0.75" stroke-linecap="round" fill="none">
        <path d="M 89.5,27.5 C 92.5,26.8 95.5,25.8 98.2,24.8" />
        <path d="M 90,29.5 C 93,29.5 96,29.8 99,30.2" />
        <path d="M 89,31.8 C 91.8,33.5 94.5,35.5 96.8,37.5" />
        <path d="M 87.5,33.8 C 89.5,36.5 91.2,39.2 92.5,41.5" />
      </g>

      <!-- REFINED GUINEA PIG PAWS -->
      <!-- 1. Rear Paw -->
      <g id="rear-paw">
        <path d="M 31.5,43 C 31,44.8 30.8,46.5 32,47 C 32.8,47.3 33.2,46.2 33.8,47.2 C 34.4,47.8 35.2,47.6 35.6,46.8 C 36.1,47.4 37,47.2 37.4,46.2 C 37.8,45 37.2,43.2 36,43 Z"
              fill="url(#paw-grad)" stroke="#030303" stroke-width="0.9" stroke-linejoin="round" />
        <path d="M 33.5,45.2 L 33.5,46.5 M 35.5,45.2 L 35.5,46.5"
              stroke="#C26B6B" stroke-width="0.65" stroke-linecap="round" />
      </g>

      <!-- 2. Front Left Paw -->
      <g id="front-left-paw">
        <path d="M 64.5,48.5 C 63.8,50.5 64.2,53.2 65.8,53.8 C 66.8,54.2 67.2,52.8 67.8,53.8 C 68.6,54.4 69.8,54 70.2,53 C 70.8,53.8 71.8,53.2 72.2,52 C 72.8,50.5 71.5,48.5 69.5,48 Z"
              fill="url(#paw-grad)" stroke="#030303" stroke-width="0.9" stroke-linejoin="round" />
        <path d="M 67.2,50.5 L 67.5,52.8 M 69.5,50 L 70,52.2"
              stroke="#C26B6B" stroke-width="0.65" stroke-linecap="round" />
      </g>

      <!-- 3. Front Right Paw -->
      <g id="front-right-paw">
        <path d="M 70.2,43 C 69.5,45 70,47.2 71.5,47.8 C 72.2,48.2 72.8,46.8 73.5,47.8 C 74.2,48.4 75.2,48.2 75.8,47.2 C 76.4,47.8 77.2,47 77.2,45.5 C 77.2,44 76,42.5 74.5,42.5 Z"
              fill="url(#paw-grad)" stroke="#030303" stroke-width="0.9" stroke-linejoin="round" />
        <path d="M 72.8,44.5 L 73.2,46.8 M 75,44.2 L 75.4,46.5"
              stroke="#C26B6B" stroke-width="0.65" stroke-linecap="round" />
      </g>
    </g>
  </g>
</svg>